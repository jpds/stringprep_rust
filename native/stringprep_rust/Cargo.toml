[package]
name = "stringprep_rust"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Rust NIF stringprep implementation with LRU cache for ejabberd"

[lib]
name = "stringprep_rust"
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1

[dependencies]
rustler = "0.37"
stringprep = "0.1"
lru = "0.16.3"
unicode-normalization = "0.1.25"
